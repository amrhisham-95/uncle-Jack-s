plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'

    id 'kotlin-kapt'
    //safeArguments For (Navigation)
    id 'androidx.navigation.safeargs.kotlin'
    //For Parcelizing
    id 'kotlin-parcelize'

    //for dagger Hilt
    id 'dagger.hilt.android.plugin'
    id 'com.google.gms.google-services'
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'

    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'kotlin-android'
    id 'kotlinx-serialization'
}

android {
    namespace "com.amrhishammahmoud.uncleJacks"
    compileSdk 35

    defaultConfig {
        applicationId "com.amrhishammahmoud.uncleJacks"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        dataBinding true

    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'com.google.firebase:firebase-auth:23.1.0'
    implementation 'com.google.firebase:firebase-database:21.0.0'
    implementation 'com.google.firebase:firebase-firestore-ktx:25.1.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    //For Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.8.4'
    implementation 'androidx.navigation:navigation-ui-ktx:2.8.4'

    //for Maps
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
    //fused location provider maps
    implementation 'com.google.android.gms:play-services-location:21.3.0'


    //for firebase (google)
    implementation 'com.firebaseui:firebase-ui-auth:7.2.0'

    //For Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.8.4'
    implementation 'androidx.navigation:navigation-ui-ktx:2.8.4'


    //for firebase
    implementation 'com.firebaseui:firebase-ui-auth:7.2.0'
    implementation 'com.google.firebase:firebase-auth-ktx:23.1.0'


    // Import the BoM for the Firebase platform
    implementation platform('com.google.firebase:firebase-bom:33.6.0')
    // Add the dependency for the Firebase Authentication library
    implementation 'com.google.firebase:firebase-auth-ktx'


    implementation platform('com.google.firebase:firebase-bom:33.6.0')

    //activity androidX - viewModel
    implementation "androidx.activity:activity-ktx:1.9.3"
    //fragment androidX - viewModel
    implementation "androidx.fragment:fragment-ktx:1.8.5"

    //retrofit
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    //Json converter
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    //Json To Kotlin Library
    implementation 'com.sealwu.jsontokotlin:library:3.7.4'

    //RXJava
    implementation 'io.reactivex.rxjava3:rxjava:3.1.5'
    //RX Android
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'
    //Adapter for RXJava3
    implementation 'com.squareup.retrofit2:adapter-rxjava3:2.9.0'

    //liveData
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.8.7"

    // Room components
    implementation "androidx.room:room-runtime:2.6.1"
    //noinspection KaptUsageInsteadOfKsp
    kapt "androidx.room:room-compiler:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    androidTestImplementation "androidx.room:room-testing:2.6.1"

    // Lifecycle components
    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"
    implementation "androidx.lifecycle:lifecycle-common-java8:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7"

    // Download and parse data
    implementation "com.squareup.moshi:moshi:1.11.0"
    implementation "com.squareup.moshi:moshi-kotlin:1.11.0"
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-moshi:2.9.0"
    implementation 'com.squareup.retrofit2:converter-scalars:2.9.0'

    // Image downloader
    implementation 'com.squareup.picasso:picasso:2.71828'

    // Kotlin coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "com.jakewharton.retrofit:retrofit2-kotlin-coroutines-adapter:0.9.2"


    // Work manager
    implementation "androidx.work:work-runtime-ktx:2.10.0"

    //for pagination
    implementation "androidx.paging:paging-runtime-ktx:3.3.4"
    implementation "androidx.paging:paging-common-ktx:3.3.4"

    //for glide
    implementation 'com.github.bumptech.glide:glide:4.9.0'

    //for coil
    implementation "io.coil-kt:coil:1.1.1"

    //for dagger hilt
    //for dagger hilt
    implementation("com.github.bumptech.glide:glide:4.9.0")
    implementation("androidx.activity:activity-ktx:1.9.3")
    kapt("org.jetbrains.kotlinx:kotlinx-metadata-jvm:0.5.0")
    implementation("androidx.core:core-ktx:1.15.0")
    implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7")
    implementation("androidx.lifecycle:lifecycle-livedata-ktx:2.8.7")
    implementation("com.google.dagger:hilt-android:2.49")
    kapt("com.google.dagger:hilt-android-compiler:2.48.1")
    kapt("androidx.hilt:hilt-compiler:1.2.0")
    implementation("androidx.hilt:hilt-navigation-fragment:1.2.0")


    implementation 'com.android.support:multidex:1.0.3'

    //for auth google
    // Import the Firebase BoM
    implementation(platform("com.google.firebase:firebase-bom:33.6.0"))

    // TODO: Add the dependencies for Firebase products you want to use
    // When using the BoM, don't specify versions in Firebase dependencies
    implementation("com.google.firebase:firebase-analytics-ktx")


    //curvedBottomNavigation
    implementation ("com.github.qamarelsafadi:CurvedBottomNavigation:0.1.3")


    //ktor client
    implementation "io.ktor:ktor-client-core:2.3.11"
    implementation("io.ktor:ktor-client-android:2.3.11")
    implementation "io.ktor:ktor-client-json:2.3.11"
    implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.0")
    implementation("io.ktor:ktor-client-logging-jvm:2.3.2")
    implementation("io.ktor:ktor-client-serialization:2.3.11")
    implementation("io.ktor:ktor-serialization-kotlinx-json:2.3.11")
    implementation("io.ktor:ktor-client-cio:2.3.11")


    implementation("io.ktor:ktor-client-content-negotiation:2.3.11")


    //google ads
    implementation ("com.google.android.gms:play-services-ads:23.5.0")


    //implementation 'com.google.ai.client.generativeai:common:0.7.1'

}